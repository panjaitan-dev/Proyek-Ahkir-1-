<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri Batu Hoda</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .galeri-section {
            margin-top: 120px;
            text-align: center;
        }

        .carousel {
            width: 80%;
            max-width: 900px;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .carousel-track {
            display: flex;
            transition: 0.6s ease;
        }

        .carousel-track img {
            width: 100%;
            flex-shrink: 0;
            height: 500px;
            object-fit: cover;
        }

        .btn-carousel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 50%;
        }

        .prev { left: 15px; }
        .next { right: 15px; }

        .btn-carousel:hover {
            background: black;
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="logo">Batu Hoda</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="galeri.html">Galeri</a>
    </nav>
</header>

<section class="galeri-section">
    <h1>Galeri Batu Hoda</h1>
    <p class="lokasi">Keindahan Danau Toba & Pantai Pasir Putih</p>

    <div class="carousel">
        <div class="carousel-track" id="track">
            <img src="FOTO-BATU-2.jpg">
            <img src="batu 3.jpg">
            <img src="batu 4.jpg">
        </div>

        <button class="btn-carousel prev" onclick="moveSlide(-1)">❮</button>
        <button class="btn-carousel next" onclick="moveSlide(1)">❯</button>
    </div>

    <a href="index.html" class="card a">Kembali</a>
</section>

<script>
let index = 0;
const track = document.getElementById("track");
const total = track.children.length;

function moveSlide(direction) {
    index += direction;

    if(index < 0) {
        index = total - 1;
    }

    if(index >= total) {
        index = 0;
    }

    track.style.transform = "translateX(-" + (index * 100) + "%)";
}
</script>

</body>
</html>
